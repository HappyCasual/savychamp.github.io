name: Update Play Store Data

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Enter the Google Play App ID (e.g., com.happycasualcompany.jiggytiles)'
        required: true
        type: string

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper for specific App
        # Passes the App ID typed in the GitHub Actions tab to the script
        run: node scraper.js "${{ github.event.inputs.app_id }}"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update Play Store data for ${{ github.event.inputs.app_id }}" || exit 0
          git push