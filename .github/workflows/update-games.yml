name: Update Play Store Data

# This tells GitHub WHEN to run the script
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at Midnight UTC
  workflow_dispatch: # Allows you to run it manually by clicking a button on GitHub

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the bot to save the games.json file to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper
        run: node scraper.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update games.json from Play Store"
          git push