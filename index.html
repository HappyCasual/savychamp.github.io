<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavyChamp Games</title>
    
    <!-- Font Awesome for Social Media Logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           AUTO LIGHT/DARK MODE VARIABLES 
        ========================================= */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1e293b;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --footer-bg: #f1f5f9;
        }

        /* Detects device dark mode and switches colors */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
                --header-bg: #1e293b;
                --card-bg: #1e293b;
                --border-color: #334155;
                --accent-color: #3b82f6;
                --footer-bg: #0b1120;
            }
        }

        /* =========================================
           GLOBAL STYLES 
        ========================================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Keeps footer at bottom */
            transition: background-color 0.3s, color 0.3s;
        }

        /* =========================================
           TOP BAR (HEADER) 
        ========================================= */
        header {
            display: flex;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative; /* Allows absolute centering of the logo */
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            /* Centers the logo and title perfectly in the middle */
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-section img {
            height: 45px;
            border-radius: 10px;
        }

        .logo-section h1 {
            font-size: 22px;
            margin: 0;
        }

        .social-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto; /* Pushes the social icons to the far right */
        }

        .social-section span {
            font-size: 15px;
            font-weight: bold;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 20px;
            margin-left: 10px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           MAIN CONTENT (DIRECT GAMES) 
        ========================================= */
        main {
            padding: 40px 5%;
            flex: 1; /* Pushes footer to the bottom */
            text-align: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background-color: var(--border-color); /* Placeholder color */
        }

        .game-card h3 {
            margin: 15px 0 15px;
            font-size: 20px;
        }

        .play-btn {
            display: inline-block;
            background: var(--accent-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            width: calc(100% - 40px);
        }

        /* =========================================
           SIMPLE FOOTER 
        ========================================= */
        footer {
            background-color: var(--footer-bg);
            padding: 20px 5%;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           RESPONSIVE DESIGN (MOBILE & TABLET) 
        ========================================= */
        @media (max-width: 850px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo-section {
                position: static; /* Removes absolute positioning on smaller screens */
                transform: none;
            }
            
            .social-section {
                margin-left: 0; /* Centers the social icons under the logo */
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header>
        <!-- Centered Logo and Title -->
        <div class="logo-section">
            <img src="logo.png" alt="SavyChamp Logo">
            <h1>SavyChamp Games</h1>
        </div>
        
        <!-- Right-Aligned Social Icons -->
        <div class="social-section">
            <span>Follow us:</span>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <!-- DIRECT GAMES -->
    <main>
        <div class="games-grid">
            
            <!-- Game 1 -->
            <div class="game-card">
                <img src="arrows-paint-1.png" alt="Arrows Paint">
                <h3>Arrows Paint</h3>
                <a href="arrows-paint.html" class="play-btn">Play Now</a>
            </div>

            <!-- Game 2 -->
            <div class="game-card">
                <img src="jig-cards-1.png" alt="Jig Cards">
                <h3>Jig Cards</h3>
                <a href="jig-cards.html" class="play-btn">Play Now</a>
            </div>

            <!-- Game 3 -->
            <div class="game-card">
                <img src="tamcall-1.png" alt="Tamcall">
                <h3>Tamcall</h3>
                <a href="tamcall.html" class="play-btn">Play Now</a>
            </div>

            <!-- Game 4 -->
            <div class="game-card">
                <img src="logo.png" alt="Love Merge">
                <h3>Love Merge</h3>
                <a href="love-merge.html" class="play-btn">Play Now</a>
            </div>

        </div>
    </main>

    <!-- SIMPLE FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
    </footer>

</body>
</html>
