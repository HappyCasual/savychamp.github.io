<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavyChamp Games</title>
    
    <!-- Font Awesome for Social Media & Store Logos (v6.5.2) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =========================================
           AUTO LIGHT/DARK MODE VARIABLES 
        ========================================= */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1e293b;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --footer-bg: #f1f5f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
                --header-bg: #1e293b;
                --card-bg: #1e293b;
                --border-color: #334155;
                --accent-color: #3b82f6;
                --footer-bg: #0b1120;
            }
        }

        /* =========================================
           GLOBAL STYLES 
        ========================================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* =========================================
           TOP BAR (HEADER) 
        ========================================= */
        header {
            display: flex;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative; 
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-section img {
            height: 45px;
            border-radius: 10px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .logo-section h1 {
            font-size: 22px;
            margin: 0;
            line-height: 1.1; 
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            opacity: 0.75;
            margin-top: 3px;
            letter-spacing: 0.3px;
            text-align: center; 
            width: 100%; 
        }

        .social-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto; 
        }

        .social-section span {
            font-size: 15px;
            font-weight: bold;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 20px;
            margin-left: 10px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           FILTER BUTTONS STYLES
        ========================================= */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* =========================================
           SEARCH BAR STYLES
        ========================================= */
        .search-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto 20px auto;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-color);
            opacity: 0.5;
        }

        #search-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border-radius: 25px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            #search-input:focus {
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            }
        }

        /* =========================================
           MAIN CONTENT (DYNAMIC GAMES LIST) 
        ========================================= */
        main {
            padding: 40px 5%;
            flex: 1; 
            text-align: center;
        }

        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            transition: box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
        }

        .game-card:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            user-select: none;
            background: transparent;
        }

        .app-icon {
            width: 60px; 
            height: 60px; 
            object-fit: contain; 
            border-radius: 12px; 
            margin: 0 15px 0 0; 
            display: block; 
            background-color: transparent;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); 
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: scale(1.05);
        }

        .card-title-area {
            flex-grow: 1;
        }

        .game-card h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
            text-align: left;
        }
        
        .card-developer {
            font-size: 13px;
            color: var(--text-color);
            opacity: 0.7;
            margin: 0;
        }

        .card-chevron {
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.5;
            transition: transform 0.3s ease;
        }

        .game-card.active .card-chevron {
            transform: rotate(180deg);
        }

        .card-body {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px solid var(--border-color);
        }

        .game-card.active .card-body {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-description {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
            margin: 15px 0;
            line-height: 1.6;
            text-align: left;
        }

        .screenshots-container {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            overflow-x: auto; 
            padding-bottom: 15px;
            margin-bottom: 20px;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .screenshots-container::-webkit-scrollbar {
            height: 6px;
        }

        .screenshots-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        .screenshot {
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .play-btn {
            display: block;
            text-align: center;
            background: var(--accent-color);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            width: calc(100% - 40px);
            margin: 0 auto;
            transition: background 0.3s;
        }
        
        .play-btn:hover {
            filter: brightness(1.1);
        }

        .play-btn i {
            margin-right: 5px;
        }
        
        .loading-text {
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.7;
            padding: 40px 0;
            text-align: center;
        }

        /* =========================================
           SIMPLE FOOTER 
        ========================================= */
        footer {
            background-color: var(--footer-bg);
            padding: 20px 5%;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           RESPONSIVE DESIGN (MOBILE & TABLET) 
        ========================================= */
        @media (max-width: 850px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo-section {
                position: static; 
                transform: none;
            }
            
            .social-section {
                margin-left: 0; 
            }

            .screenshot {
                height: 150px; 
            }
            
            .app-icon {
                width: 50px;
                height: 50px;
                margin-right: 12px;
            }
            
            .game-card h3 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header>
        <div class="logo-section">
            <img src="logo.png" alt="SavyChamp Logo">
            <div class="title-group">
                <h1>SavyChamp Games</h1>
                <span class="tagline">More Fun. Less Ads.</span>
            </div>
        </div>
        
        <div class="social-section">
            <span>Community:</span>
            <div class="social-icons">
                <a href="https://www.facebook.com/SavyChamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.youtube.com/@SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/savychamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://x.com/SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://whatsapp.com/channel/0029VbC19GNGJP8NNgmvj12h" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main>
        <!-- FILTER BUTTONS -->
        <div class="filter-container">
            <button id="btn-games" class="filter-btn active">Games</button>
            <button id="btn-apps" class="filter-btn">Apps</button>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="Search in Games...">
        </div>

        <!-- DYNAMIC LIST -->
        <div class="games-grid" id="games-container">
            <div class="loading-text">Loading from Play Store...</div>
        </div>
    </main>

    <!-- SIMPLE FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
    </footer>

    <!-- JAVASCRIPT TO LOAD AND FILTER DATA -->
    <script>
        let allItems = [];
        let currentFilter = 'game'; 
        let searchQuery = '';

        document.addEventListener("DOMContentLoaded", () => {
            const btnGames = document.getElementById('btn-games');
            const btnApps = document.getElementById('btn-apps');
            const searchInput = document.getElementById('search-input');

            // Search input listener
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderItems();
            });

            // Button click listeners
            btnGames.addEventListener('click', () => {
                btnGames.classList.add('active');
                btnApps.classList.remove('active');
                currentFilter = 'game';
                
                // Clear search and update placeholder when switching tabs
                searchInput.value = '';
                searchQuery = '';
                searchInput.placeholder = 'Search in Games...';
                
                renderItems();
            });

            btnApps.addEventListener('click', () => {
                btnApps.classList.add('active');
                btnGames.classList.remove('active');
                currentFilter = 'app';
                
                // Clear search and update placeholder when switching tabs
                searchInput.value = '';
                searchQuery = '';
                searchInput.placeholder = 'Search in Apps...';
                
                renderItems();
            });
            
            fetch('games.json?nocache=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    allItems = data;
                    renderItems();
                })
                .catch(error => {
                    console.error('Error loading data:', error);
                    document.getElementById('games-container').innerHTML = 
                        '<div class="loading-text">Failed to load data. Please check back later!</div>';
                });
        });

        function renderItems() {
            const container = document.getElementById('games-container');
            container.innerHTML = ''; 

            if (allItems.length === 0) {
                container.innerHTML = '<div class="loading-text">No items found yet.</div>';
                return;
            }

            // Filter the items by Type AND Search Query
            const filteredData = allItems.filter(item => {
                const itemType = item.type || 'game';
                const matchesType = itemType === currentFilter;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                                      (item.developer && item.developer.toLowerCase().includes(searchQuery));
                
                return matchesType && matchesSearch;
            });

            // Handle empty results
            if (filteredData.length === 0) {
                if (searchQuery) {
                    container.innerHTML = `<div class="loading-text">No results found for "${searchQuery}".</div>`;
                } else {
                    container.innerHTML = `<div class="loading-text">No ${currentFilter}s found yet.</div>`;
                }
                return;
            }

            // Render matching items
            filteredData.forEach(game => {
                let screenshotsHtml = '';
                
                if (game.screenshots && Array.isArray(game.screenshots) && game.screenshots.length > 0) {
                    screenshotsHtml = game.screenshots.map(imgUrl => 
                        `<img src="${imgUrl}" alt="Screenshot of ${game.title}" class="screenshot" loading="lazy">`
                    ).join('');
                }

                const card = `
                    <div class="game-card">
                        
                        <div class="card-header" onclick="this.parentElement.classList.toggle('active')">
                            <img src="${game.icon}" alt="${game.title} Logo" class="app-icon" loading="lazy">
                            <div class="card-title-area">
                                <h3>${game.title}</h3>
                                <p class="card-developer">${game.developer || 'SavyChamp'}</p>
                            </div>
                            <i class="fa-solid fa-chevron-down card-chevron"></i>
                        </div>
                        
                        <div class="card-body">
                            <p class="app-description">${game.description || 'Enjoy this wonderful experience by SavyChamp.'}</p>
                            
                            <div class="screenshots-container">
                                ${screenshotsHtml}
                            </div>
                            
                            <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="play-btn">
                                <i class="fa-brands fa-google-play"></i> Get it on Play Store
                            </a>
                        </div>

                    </div>
                `;
                container.innerHTML += card;
            });
        }
    </script>

</body>
</html>
