<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavyChamp Games</title>
    
    <!-- Font Awesome for Social Media & Store Logos (v6.5.2) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =========================================
           AUTO LIGHT/DARK MODE VARIABLES 
        ========================================= */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1e293b;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --footer-bg: #f1f5f9;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
                --header-bg: #1e293b;
                --card-bg: #1e293b;
                --border-color: #334155;
                --accent-color: #3b82f6;
                --footer-bg: #0b1120;
            }
        }

        /* =========================================
           GLOBAL STYLES 
        ========================================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* =========================================
           TOP BAR (HEADER) 
        ========================================= */
        header {
            display: flex;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative; 
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-section img {
            height: 45px;
            border-radius: 10px;
        }

        /* Groups the title and tagline vertically */
        .title-group {
            display: flex;
            flex-direction: column;
        }

        .logo-section h1 {
            font-size: 22px;
            margin: 0;
            line-height: 1.1; 
        }

        /* Professional tagline styling - updated to right align */
        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
            opacity: 0.75;
            margin-top: 3px;
            letter-spacing: 0.3px;
            text-align: center; /* Aligns the text to the right */
            width: 100%; /* Ensures it spans the full width of the title above it */
        }

        .social-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto; 
        }

        .social-section span {
            font-size: 15px;
            font-weight: bold;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 20px;
            margin-left: 10px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           MAIN CONTENT (DYNAMIC GAMES) 
        ========================================= */
        main {
            padding: 40px 5%;
            flex: 1; 
            text-align: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            text-align: left;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .game-card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-icon {
            width: 120px; 
            height: 120px; 
            object-fit: contain; 
            border-radius: 24px; 
            margin: 0 auto 15px; 
            display: block; 
            background-color: transparent;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12); 
            transition: transform 0.2s;
        }

        .app-icon:hover {
            transform: scale(1.05);
        }

        .game-card h3 {
            margin: 10px 0 5px;
            font-size: 22px;
            text-align: center;
        }

        .app-description {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
            margin: 5px 0 20px 0;
            line-height: 1.6;
            text-align: center;
        }

        .screenshots-container {
            display: flex;
            gap: 12px;
            justify-content: flex-start;
            overflow-x: auto; 
            padding-bottom: 15px;
            margin-bottom: 20px;
            width: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .screenshots-container::-webkit-scrollbar {
            height: 6px;
        }

        .screenshots-container::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        .screenshot {
            height: 180px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .play-btn {
            display: block;
            text-align: center;
            background: var(--accent-color);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            width: calc(100% - 40px);
            margin: 0 auto;
            transition: background 0.3s;
        }
        
        .play-btn:hover {
            filter: brightness(1.1);
        }

        .play-btn i {
            margin-right: 5px;
        }
        
        .loading-text {
            grid-column: 1 / -1;
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.7;
            padding: 40px 0;
            text-align: center;
        }

        /* =========================================
           SIMPLE FOOTER 
        ========================================= */
        footer {
            background-color: var(--footer-bg);
            padding: 20px 5%;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           RESPONSIVE DESIGN (MOBILE & TABLET) 
        ========================================= */
        @media (max-width: 850px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo-section {
                position: static; 
                transform: none;
            }
            
            .social-section {
                margin-left: 0; 
            }

            .screenshot {
                height: 150px; 
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header>
        <div class="logo-section">
            <img src="logo.png" alt="SavyChamp Logo">
            <!-- Wrapped title and tagline here -->
            <div class="title-group">
                <h1>SavyChamp Games</h1>
                <span class="tagline">More Fun. Less Ads.</span>
            </div>
        </div>
        
        <div class="social-section">
            <span>Community:</span>
            <div class="social-icons">
                <a href="https://www.facebook.com/SavyChamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.youtube.com/@SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/savychamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://x.com/SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://whatsapp.com/channel/0029VbC19GNGJP8NNgmvj12h" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <!-- DIRECT GAMES -->
    <main>
        <div class="games-grid" id="games-container">
            <div class="loading-text">Loading games from Play Store...</div>
        </div>
    </main>

    <!-- SIMPLE FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
    </footer>

    <!-- JAVASCRIPT TO LOAD GAMES FROM JSON -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            fetch('games.json?nocache=' + new Date().getTime())
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(games => {
                    const container = document.getElementById('games-container');
                    container.innerHTML = ''; 

                    if (games.length === 0) {
                        container.innerHTML = '<div class="loading-text">No games found yet.</div>';
                        return;
                    }

                    games.forEach(game => {
                        
                        let screenshotsHtml = '';
                        
                        if (game.screenshots && Array.isArray(game.screenshots) && game.screenshots.length > 0) {
                            screenshotsHtml = game.screenshots.map(imgUrl => 
                                `<img src="${imgUrl}" alt="Screenshot of ${game.title}" class="screenshot" loading="lazy">`
                            ).join('');
                        }

                        const card = `
                            <div class="game-card">
                                <div class="game-card-content">
                                    <img src="${game.icon}" alt="${game.title} Logo" class="app-icon" loading="lazy">
                                    
                                    <h3>${game.title}</h3>
                                    
                                    <p class="app-description">${game.description || 'Enjoy this wonderful game by SavyChamp.'}</p>
                                    
                                    <div class="screenshots-container">
                                        ${screenshotsHtml}
                                    </div>
                                </div>
                                
                                <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="play-btn">
                                    <i class="fa-brands fa-google-play"></i> Get it on Play Store
                                </a>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                })
                .catch(error => {
                    console.error('Error loading games:', error);
                    document.getElementById('games-container').innerHTML = 
                        '<div class="loading-text">Failed to load games data. Please check back later!</div>';
                });
        });
    </script>

</body>
</html>
