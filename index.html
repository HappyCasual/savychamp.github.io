<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavyChamp Games</title>
    
    <!-- Font Awesome for Social Media & Store Logos (v6.5.2) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =========================================
           AUTO LIGHT/DARK MODE VARIABLES 
        ========================================= */
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1e293b;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --footer-bg: #f1f5f9;
        }

        /* Detects device dark mode and switches colors */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --text-color: #f8fafc;
                --header-bg: #1e293b;
                --card-bg: #1e293b;
                --border-color: #334155;
                --accent-color: #3b82f6;
                --footer-bg: #0b1120;
            }
        }

        /* =========================================
           GLOBAL STYLES 
        ========================================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Keeps footer at bottom */
            transition: background-color 0.3s, color 0.3s;
        }

        /* =========================================
           TOP BAR (HEADER) 
        ========================================= */
        header {
            display: flex;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            position: relative; /* Allows absolute centering of the logo */
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            /* Centers the logo and title perfectly in the middle */
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo-section img {
            height: 45px;
            border-radius: 10px;
        }

        .logo-section h1 {
            font-size: 22px;
            margin: 0;
        }

        .social-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto; /* Pushes the social icons to the far right */
        }

        .social-section span {
            font-size: 15px;
            font-weight: bold;
        }

        .social-icons a {
            color: var(--text-color);
            font-size: 20px;
            margin-left: 10px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           MAIN CONTENT (DYNAMIC GAMES) 
        ========================================= */
        main {
            padding: 40px 5%;
            flex: 1; /* Pushes footer to the bottom */
            text-align: center;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        /* UPDATED: Perfect Square App Icons */
        .game-card img {
            width: 160px; /* Fixed square width */
            height: 160px; /* Fixed square height */
            object-fit: contain; /* Ensures the whole logo fits without cropping */
            border-radius: 24px; /* Play Store style rounded corners */
            margin: 0 auto; /* Centers the icon perfectly */
            display: block; /* Required for margin auto to work */
            background-color: transparent;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15); /* Subtle shadow so the icon pops */
        }

        .game-card h3 {
            margin: 20px 0 15px;
            font-size: 20px;
        }

        .play-btn {
            display: inline-block;
            background: var(--accent-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            width: calc(100% - 40px);
        }
        
        .play-btn i {
            margin-right: 5px;
        }
        
        .loading-text {
            grid-column: 1 / -1;
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.7;
            padding: 40px 0;
        }

        /* =========================================
           SIMPLE FOOTER 
        ========================================= */
        footer {
            background-color: var(--footer-bg);
            padding: 20px 5%;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .footer-links a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* =========================================
           RESPONSIVE DESIGN (MOBILE & TABLET) 
        ========================================= */
        @media (max-width: 850px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            
            .logo-section {
                position: static; /* Removes absolute positioning on smaller screens */
                transform: none;
            }
            
            .social-section {
                margin-left: 0; /* Centers the social icons under the logo */
            }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header>
        <!-- Centered Logo and Title -->
        <div class="logo-section">
            <img src="logo.png" alt="SavyChamp Logo">
            <h1>SavyChamp Games</h1>
        </div>
        
        <!-- Right-Aligned Social Icons -->
        <div class="social-section">
            <span>Community:</span>
            <div class="social-icons">
                <a href="https://www.facebook.com/SavyChamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook"></i></a>
                <a href="https://www.youtube.com/@SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
                <a href="https://www.instagram.com/savychamp/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
                <!-- X logo -->
                <a href="https://x.com/SavyChamp" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="https://whatsapp.com/channel/0029VbC19GNGJP8NNgmvj12h" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <!-- DIRECT GAMES -->
    <main>
        <!-- ID added here so JavaScript can inject the games automatically -->
        <div class="games-grid" id="games-container">
            <div class="loading-text">Loading games from Play Store...</div>
        </div>
    </main>

    <!-- SIMPLE FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
    </footer>

    <!-- JAVASCRIPT TO LOAD GAMES FROM JSON -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('games.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(games => {
                    const container = document.getElementById('games-container');
                    container.innerHTML = ''; // Remove the loading text

                    // Check if games exist in the JSON
                    if (games.length === 0) {
                        container.innerHTML = '<div class="loading-text">No games found yet.</div>';
                        return;
                    }

                    // Loop through each game and generate HTML
                    games.forEach(game => {
                        const card = `
                            <div class="game-card">
                                <img src="${game.icon}" alt="${game.title}">
                                <h3>${game.title}</h3>
                                <a href="${game.url}" target="_blank" rel="noopener noreferrer" class="play-btn">
                                    <i class="fa-brands fa-google-play"></i> Get it on Play Store
                                </a>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                })
                .catch(error => {
                    console.error('Error loading games:', error);
                    // Fallback message if games.json fails to load
                    document.getElementById('games-container').innerHTML = 
                        '<div class="loading-text">Failed to load games data. Please check back later!</div>';
                });
        });
    </script>

</body>
</html>
